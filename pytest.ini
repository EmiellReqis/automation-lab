[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    smoke: fast, critical checks
    integration: broader scenarios
    api: Exercises API endpoints via HTTP client (requests)
    unit: Verifies business logic in isolation (fast feedback)
    ui: Browser-based flows (Playwright)
filterwarnings =
    error::pytest.PytestUnknownMarkWarning